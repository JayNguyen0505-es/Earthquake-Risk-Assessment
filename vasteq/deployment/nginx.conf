# Mounted as /etc/nginx/conf.d/default.conf in the official nginx image.
# Host networking lets this Linux container reach the host-side backend.
server {
    listen 28080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;
    ssi on;

    # Preserve the complete /api/v1/... path and forward bearer headers.
    location /api/ {
        ssi off;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /inc/ {
        internal;
    }

    # This frontend uses real HTML pages, not an SPA fallback.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
