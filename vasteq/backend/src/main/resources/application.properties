quarkus.application.name=vasteq-backend
quarkus.http.host=127.0.0.1
quarkus.http.limits.max-body-size=16K
quarkus.jackson.fail-on-unknown-properties=true
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USER:vasteq}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/vasteq?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.jdbc.timezone=UTC
mp.jwt.verify.issuer=${JWT_ISSUER:https://vasteq.local}
mp.jwt.verify.audiences=vasteq-api
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY}
vasteq.jwt.ttl-seconds=900
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:users;MODE=MySQL;DB_CLOSE_DELAY=-1
%test.mp.jwt.verify.publickey.location=publicKey.pem
%test.smallrye.jwt.sign.key.location=privateKey.pem
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
