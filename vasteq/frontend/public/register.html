<!doctype html>
<html lang="en">
<head>
  <!--#set var="page" value="auth" -->
  <!--#include virtual="/inc/head.html" -->
  <meta name="description" content="Create a VAST-Earthquake account to access earthquake data and assessment tools.">
  <title>Create your account · VAST-Earthquake</title>
</head>
<body>
  <main class="auth-page container-fluid">
    <div class="auth-box">
      <!--#include virtual="/inc/brand.html" -->

      <section class="card auth-card" aria-labelledby="title">
        <header class="auth-head">
          <h1 id="title" tabindex="-1">Create your account</h1>
          <p id="subtitle">Access earthquake data and assessment tools.</p>
        </header>

        <noscript><p class="notice-error">Enable JavaScript to create an account.</p></noscript>

        <form id="register" novalidate>
          <div class="group">
            <div class="field">
              <label for="name">Display name</label>
              <input class="form-control" id="name" name="displayName" type="text" autocomplete="name" maxlength="120" placeholder="Your name" required aria-describedby="name-error">
            </div>
            <p class="hint-error" id="name-error" aria-live="polite"></p>
          </div>

          <div class="group">
            <div class="field">
              <label for="email">Email</label>
              <input class="form-control" id="email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="254" placeholder="you@example.com" required aria-describedby="email-error">
            </div>
            <p class="hint-error" id="email-error" aria-live="polite"></p>
          </div>

          <div class="group">
            <div class="field pass-field">
              <label for="pass">Password</label>
              <input class="form-control" id="pass" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required aria-describedby="pass-help pass-error">
              <button class="pass-toggle" type="button" data-pass="pass" aria-controls="pass" aria-label="Show password" aria-pressed="false">Show</button>
            </div>
            <p class="hint" id="pass-help">Use 12–128 characters.</p>
            <p class="hint-error" id="pass-error" aria-live="polite"></p>
          </div>

          <div class="group">
            <div class="field pass-field">
              <label for="confirm">Confirm password</label>
              <input class="form-control" id="confirm" name="confirmPassword" type="password" autocomplete="new-password" maxlength="128" required aria-describedby="confirm-error">
              <button class="pass-toggle" type="button" data-pass="confirm" aria-controls="confirm" aria-label="Show confirmation password" aria-pressed="false">Show</button>
            </div>
            <p class="hint-error" id="confirm-error" aria-live="polite"></p>
          </div>

          <!--#set var="submit" value="Create account" -->
          <!--#include virtual="/inc/submit.html" -->
        </form>

        <div id="success" class="success" hidden>
          <span class="check-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="m6 12 4 4 8-8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <a class="btn btn-primary btn-block btn-main" href="login.html">Sign in</a>
        </div>

        <footer id="auth-foot" class="auth-foot">
          Already have an account? <a href="login.html">Sign in</a>
        </footer>
      </section>
      <!--#include virtual="/inc/caption.html" -->
    </div>
  </main>
</body>
</html>
