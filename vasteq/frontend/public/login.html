<!doctype html>
<html lang="en">
<head>
  <!--#set var="page" value="auth" -->
  <!--#include virtual="/inc/head.html" -->
  <meta name="description" content="Sign in to your VAST-Earthquake account.">
  <title>Sign in · VAST-Earthquake</title>
</head>
<body>
  <main class="auth-page container-fluid">
    <div class="auth-box">
      <!--#include virtual="/inc/brand.html" -->

      <section class="card auth-card" aria-labelledby="title">
        <header class="auth-head">
          <h1 id="title">Sign in</h1>
          <p>Access your VAST-Earthquake account.</p>
        </header>

        <noscript><p class="notice-error">Enable JavaScript to sign in.</p></noscript>

        <form id="login" novalidate>
          <div class="group">
            <div class="field">
              <label for="email">Email</label>
              <input class="form-control" id="email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="254" placeholder="you@example.com" required aria-describedby="email-error">
            </div>
            <p class="hint-error" id="email-error" aria-live="polite"></p>
          </div>

          <div class="group">
            <div class="field pass-field">
              <label for="pass">Password</label>
              <input class="form-control" id="pass" name="password" type="password" autocomplete="current-password" maxlength="128" required aria-describedby="pass-error">
              <button class="pass-toggle" type="button" data-pass="pass" aria-controls="pass" aria-label="Show password" aria-pressed="false">Show</button>
            </div>
            <p class="hint-error" id="pass-error" aria-live="polite"></p>
          </div>

          <!--#set var="submit" value="Sign in" -->
          <!--#include virtual="/inc/submit.html" -->
        </form>

        <footer class="auth-foot">
          New to VAST-Earthquake? <a href="register.html">Create an account</a>
        </footer>
      </section>
      <!--#include virtual="/inc/caption.html" -->
    </div>
  </main>
</body>
</html>
