<!doctype html>
<html lang="en">
<head>
  <!--#set var="page" value="account" -->
  <!--#include virtual="/inc/head.html" -->
  <title>My account · VAST-Earthquake</title>
</head>
<body>
  <main class="auth-page container-fluid">
    <div class="auth-box">
      <!--#include virtual="/inc/brand.html" -->
      <section class="card auth-card" aria-labelledby="title">
        <header class="auth-head">
          <h1 id="title">Welcome</h1>
          <p id="status" role="status">Loading your account…</p>
        </header>
        <noscript><p class="notice-error">Enable JavaScript to view your account.</p></noscript>
        <dl id="account" class="details" hidden>
          <dt>Display name</dt><dd id="name"></dd>
          <dt>Email</dt><dd id="email"></dd>
        </dl>
        <p id="error" class="notice-error" role="alert" hidden></p>
        <button id="retry" class="btn btn-primary btn-block btn-main" type="button" hidden>Try again</button>
        <footer class="auth-foot">
          <button id="sign-out" class="btn btn-session" type="button">Sign out</button>
        </footer>
      </section>
      <!--#include virtual="/inc/caption.html" -->
    </div>
  </main>
</body>
</html>
